{% extends 'customer_portal/base.html' %}
{% block title %}Create Agreement{% endblock %}
{% block content %}
<div class="fade-in" style="max-width:600px;margin:0 auto;">
  <div class="card">
    <h3 style="margin-bottom:16px;">Create New Agreement</h3>
    {% if success %}
    <div class="alert-success" style="margin-bottom:12px;">{{ success }}</div>
    {% endif %}
    {% if error %}
    <div class="alert-error" style="margin-bottom:12px;">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="form-label">Title *</label>
      <input type="text" name="title" class="form-input" value="{{ title }}" placeholder="e.g. Freelance Payment" required>
      <label class="form-label" style="margin-top:12px;">Description</label>
      <textarea name="description" class="form-input" style="min-height:60px;" placeholder="Describe the agreement">{{ description }}</textarea>
      <label class="form-label" style="margin-top:12px;">Amount (KES) *</label>
      <input type="number" step="0.01" name="amount" class="form-input" value="{{ amount }}" placeholder="e.g. 50000" required>
      <label class="form-label" style="margin-top:12px;">Buyer Name</label>
      <input type="text" name="buyer_name" class="form-input" placeholder="Who is paying?">
      <div style="margin-top:20px;display:flex;gap:12px;">
        <button type="submit" class="btn">Create Agreement</button>
        <a href="/portal/agreements/" class="btn" style="background:var(--bg2);color:var(--text1);">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
