{% extends 'customer_portal/base.html' %}
{% block title %}Agreements{% endblock %}
{% block content %}
<div class="table-wrap">
  <div class="hdr">All Agreements</div>
  <table><thead><tr><th>ID</th><th>Title</th><th>Amount</th><th>Status</th></tr></thead>
    <tbody>{% for a in agreements %}<tr><td style="font-family:monospace">{{ a.agreement_id }}</td><td>{{ a.title }}</td><td>KES {{ a.amount|floatformat:2 }}</td><td>{{ a.status }}</td></tr>{% empty %}<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--text3);">No agreements</td></tr>{% endfor %}</tbody>
  </table>
</div>
{% endblock %}
