{% extends 'admin_dashboard/base.html' %}
{% block page_title %}Create Customer{% endblock %}
{% block content %}

<div class="card" style="max-width:600px;">
  <h3>New Customer</h3>
  <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">Create a new tenant on the TrustLayer platform.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Organization Name *</label>
      <input type="text" name="name" class="form-input" required placeholder="e.g. Kenyatta Hospital">
    </div>
    <div class="form-group">
      <label>Industry</label>
      <select name="industry" class="form-select">
        <option value="">Select industry</option>
        <option value="SACCO">SACCO</option>
        <option value="Hospital">Hospital</option>
        <option value="Ecommerce">Ecommerce</option>
        <option value="Land">Land</option>
        <option value="Events">Events</option>
        <option value="Insurance">Insurance</option>
        <option value="School">School</option>
        <option value="Car Dealer">Car Dealer</option>
        <option value="Law Firm">Law Firm</option>
      </select>
    </div>
    <div class="form-group">
      <label>Admin Name</label>
      <input type="text" name="admin_name" class="form-input" placeholder="e.g. Dr. John M.">
    </div>
    <div class="form-group">
      <label>Admin Phone</label>
      <input type="text" name="admin_phone" class="form-input" placeholder="e.g. 254712345678">
    </div>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" name="admin_email" class="form-input" placeholder="admin@hospital.com">
    </div>
    <button type="submit" class="btn btn-primary">Create Customer</button>
    <a href="/admin/customers/" class="btn btn-ghost">Cancel</a>
  </form>
</div>
{% endblock %}
