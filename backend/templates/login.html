{% extends "base.html" %}
{% block title %}Agent Login — TrustLayer{% endblock %}

{% block content %}
<div class="section">
  <div class="container-xs" style="padding:80px 0;">
    <div class="card card-lg">
      <h1 style="font-size:32px;font-weight:900;margin-bottom:8px;">Agent login</h1>
      <p style="color:var(--text2);margin-bottom:28px;">Open the investigation workspace. Customers use Report and Track — this is for operators.</p>
      {% if error %}
      <div class="alert alert-error" style="margin-bottom:20px;">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login/">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" name="username" value="agent" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
