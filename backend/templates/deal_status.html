<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLayer — Deal Status</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#00c46a;--green-dark:#009e56;--ink:#0d1117;--surface:#f4f6f0;--card:#ffffff;--muted:#6b7280;--border:#e2e8e0;--radius:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--card);border-radius:24px;box-shadow:0 4px 40px rgba(0,0,0,.08);width:100%;max-width:440px;overflow:hidden;}
.card-top{background:var(--ink);padding:32px 36px 28px;color:white;}
.badge{display:inline-block;font-family:'DM Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;margin-bottom:16px;letter-spacing:.05em;}
.badge.pending{background:#d97706;color:white;}
.badge.held{background:#2563eb;color:white;}
.badge.done{background:#16a34a;color:white;}
.badge.refunded{background:#dc2626;color:white;}
.badge.default{background:#4b5563;color:white;}
.card-top h1{font-size:22px;font-weight:600;margin-bottom:6px;}
.card-top p{font-size:14px;color:#9ca3af;font-family:'DM Mono',monospace;letter-spacing:.06em;}
.card-body{padding:32px 36px;}
.search-row{display:flex;gap:10px;margin-bottom:24px;}
.search-row input{flex:1;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:'DM Mono',monospace;color:var(--ink);background:#fafafa;}
.search-row input:focus{outline:none;border-color:var(--green);background:white;}
.search-row button{padding:13px 18px;background:var(--ink);color:white;border:none;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;}
.search-row button:hover{background:#1f2937;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.info-cell{background:var(--surface);border-radius:10px;padding:14px;}
.info-cell .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.info-cell .value{font-size:15px;font-weight:600;color:var(--ink);font-family:'DM Mono',monospace;}
.info-cell.wide{grid-column:1/-1;}
.state-track{display:flex;align-items:center;margin-bottom:24px;}
.state-step{display:flex;flex-direction:column;align-items:center;flex:1;}
.state-dot{width:28px;height:28px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:600;transition:all .3s;}
.state-dot.active{background:var(--green);color:white;}
.state-dot.done-state{background:var(--ink);color:white;}
.state-label{font-size:11px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.06em;}
.state-line{flex:1;height:2px;background:var(--border);margin:0 4px;margin-bottom:16px;}
.state-line.done-line{background:var(--green);}
.actions{display:flex;flex-direction:column;gap:10px;}
.btn{width:100%;padding:15px;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;font-family:'DM Sans',sans-serif;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-release{background:var(--green);color:white;}
.btn-release:hover:not(:disabled){background:var(--green-dark);}
.btn-refund{background:transparent;color:#dc2626;border:1.5px solid #fecaca;}
.btn-refund:hover:not(:disabled){background:#fef2f2;}
.msg{padding:14px 16px;border-radius:var(--radius);font-size:14px;margin-top:12px;display:none;}
.msg.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.msg.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.nav{display:flex;gap:8px;justify-content:center;padding:16px 0 8px;border-top:1px solid var(--border);}
.nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;transition:background .15s;}
.nav a:hover{background:var(--surface);color:var(--ink);}
.nav a.active{color:var(--green);font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:20px 0;font-size:14px;}
</style>
</head>
<body>
<div class="card">
  <div class="card-top" id="cardTop">
    <div class="badge default" id="stateBadge">TRUSTLAYER</div>
    <h1 id="cardTitle">Deal Status</h1>
    <p id="cardSub">Enter a deal code to check status</p>
  </div>
  <div class="card-body">
    <div class="search-row">
      <input type="text" id="codeInput" placeholder="TL-XXXXXX" oninput="this.value=this.value.toUpperCase()">
      <button onclick="lookup()">Check</button>
    </div>

    <div id="dealPanel" style="display:none">
      <div class="state-track">
        <div class="state-step">
          <div class="state-dot" id="dot0">1</div>
          <div class="state-label">Pending</div>
        </div>
        <div class="state-line" id="line1"></div>
        <div class="state-step">
          <div class="state-dot" id="dot1">2</div>
          <div class="state-label">Held</div>
        </div>
        <div class="state-line" id="line2"></div>
        <div class="state-step">
          <div class="state-dot" id="dot2">3</div>
          <div class="state-label">Done</div>
        </div>
      </div>

      <div class="info-grid">
        <div class="info-cell wide">
          <div class="label">Deal code</div>
          <div class="value" id="iCode">—</div>
        </div>
        <div class="info-cell">
          <div class="label">Amount</div>
          <div class="value" id="iAmt">—</div>
        </div>
        <div class="info-cell">
          <div class="label">Fee</div>
          <div class="value" id="iFee">—</div>
        </div>
        <div class="info-cell">
          <div class="label">Total paid</div>
          <div class="value" id="iTotal">—</div>
        </div>
        <div class="info-cell">
          <div class="label">M-Pesa receipt</div>
          <div class="value" id="iReceipt">—</div>
        </div>
      </div>

      <div class="actions" id="actions"></div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="empty" id="empty" style="display:none">Deal not found. Check the code and try again.</div>
  </div>
  <nav class="nav">
    <a href="/create-deal/">Create</a>
    <a href="/pay-mpesa/">Pay</a>
    <a href="/deal-status/" class="active">Status</a>
  </nav>
</div>
<script>
const AUTH = 'Basic ' + btoa('root:Joel@2026');
let currentCode = '';
window.onload=()=>{
  const saved=localStorage.getItem('deal_code');
  if(saved){document.getElementById('codeInput').value=saved;lookup();}
};
async function lookup(){
  const code=document.getElementById('codeInput').value.trim().toUpperCase();
  if(!code)return;
  currentCode=code;
  try{
    const r=await fetch('/api/nano/deals/'+code+'/',{headers:{'Authorization':AUTH}});
    if(r.ok){
      const d=await r.json();
      render(d);
    } else {
      document.getElementById('dealPanel').style.display='none';
      document.getElementById('empty').style.display='block';
    }
  }catch(e){document.getElementById('empty').style.display='block';}
}
function render(d){
  document.getElementById('empty').style.display='none';
  document.getElementById('dealPanel').style.display='block';
  const s=d.state;
  const badge=document.getElementById('stateBadge');
  badge.textContent=s.toUpperCase();
  badge.className='badge '+s;
  document.getElementById('cardTitle').textContent=d.deal_code;
  document.getElementById('cardSub').textContent=d.description||'No description';
  document.getElementById('iCode').textContent=d.deal_code;
  document.getElementById('iAmt').textContent='KES '+parseFloat(d.amount).toLocaleString();
  document.getElementById('iFee').textContent='KES '+d.fee;
  document.getElementById('iTotal').textContent='KES '+d.total_payable;
  document.getElementById('iReceipt').textContent=d.mpesa_receipt||'—';
  const steps=['pending','held','done'];
  const idx=steps.indexOf(s);
  for(let i=0;i<3;i++){
    const dot=document.getElementById('dot'+i);
    dot.className='state-dot'+(i<idx?' done-state':i===idx?' active':'');
  }
  if(document.getElementById('line1'))document.getElementById('line1').className='state-line'+(idx>0?' done-line':'');
  if(document.getElementById('line2'))document.getElementById('line2').className='state-line'+(idx>1?' done-line':'');
  const actions=document.getElementById('actions');
  actions.innerHTML='';
  if(s==='held'){
    actions.innerHTML='<button class="btn btn-release" onclick="release()">Release Funds to Receiver</button><button class="btn btn-refund" onclick="refund()">Refund (Manual Exception)</button>';
  } else if(s==='pending'){
    actions.innerHTML='<a href="/pay-mpesa/" style="display:block;text-align:center;padding:15px;background:#f4f6f0;border-radius:14px;color:#374151;font-weight:600;text-decoration:none;">→ Pay via M-Pesa</a>';
  } else if(s==='done'){
    actions.innerHTML='<div style="text-align:center;color:#16a34a;font-weight:600;padding:10px 0;">Deal complete. Funds released.</div>';
  } else if(s==='refunded'){
    actions.innerHTML='<div style="text-align:center;color:#dc2626;font-weight:600;padding:10px 0;">Deal refunded.</div>';
  }
}
async function release(){
  if(!confirm('Release funds to receiver?'))return;
  await doAction('release');
}
async function refund(){
  if(!confirm('Refund this deal? This is a manual exception.'))return;
  await doAction('refund');
}
async function doAction(action){
  try{
    const r=await fetch('/api/nano/deals/'+currentCode+'/release/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':AUTH},body:JSON.stringify({action:action})});
    const d=await r.json();
    if(r.ok&&d.success){showMsg(d.message,'ok');setTimeout(lookup,1000);}
    else showMsg(d.error||'Failed','err');
  }catch(e){showMsg('Network error','err');}
}
function showMsg(m,t){const el=document.getElementById('msg');el.innerHTML=m;el.className='msg '+t;}
</script>
</body>
</html>
