<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Case — TrustLayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #FF5522; --accent-hover: #E04418; --text: #111111; --text-secondary: #555; --bg: #FFFFFF; --bg-alt: #F8F8F8; --border: #EEE; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { max-width: 440px; width: 100%; text-align: center; padding: 48px 32px; }
    h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px; }
    p { font-size: 15px; color: var(--text-secondary); margin-bottom: 32px; }
    .search-form { display: flex; gap: 8px; }
    .search-input { flex: 1; height: 50px; border-radius: 12px; border: 1px solid var(--border); padding: 0 16px; font-size: 15px; font-family: 'Inter', sans-serif; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .search-btn { height: 50px; padding: 0 24px; border-radius: 12px; background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
    .search-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Track your case</h1>
    <p>Enter your case ID to see the current status and timeline.</p>
    <form class="search-form" method="get" action="/track/">
      <input type="text" name="id" class="search-input" placeholder="e.g. CASE-XXXXXXXXXX" required>
      <button type="submit" class="search-btn">Track</button>
    </form>
  </div>
</body>
</html>
