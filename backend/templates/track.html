{% extends "base.html" %}
{% block title %}Track Case — TrustLayer{% endblock %}

{% block content %}
<div class="section">
  <div class="container-xs" style="padding:80px 0;">
    <div class="card card-lg" style="text-align:center;">
      <h1 style="font-size:32px;font-weight:900;margin-bottom:8px;">Track your case</h1>
      <p style="color:var(--text2);margin-bottom:28px;">Enter your case ID to see status, evidence, messages, and verification.</p>
      <form method="get" action="/track/" style="display:flex;gap:10px;">
        <input type="text" name="id" class="form-input" placeholder="e.g. CASEXXXXXXXXXX" required>
        <button type="submit" class="btn btn-primary">Track</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
