{% extends "base.html" %}
{% block title %}Track a case — TrustLayer{% endblock %}
{% block content %}
<div class="page" style="max-width:520px;text-align:center;">
  <div class="card">
    <h1>Track your case</h1>
    <p style="color:var(--text2);margin:8px 0 20px;">Enter the case ID from your confirmation screen.</p>
    <form method="get" action="/track/" style="display:flex;gap:8px;">
      <input class="form-input" type="text" name="id" placeholder="CASE-XXXXXXXX" required>
      <button class="btn btn-primary" type="submit">Track</button>
    </form>
  </div>
</div>
{% endblock %}
