<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — Secure Payment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:420px;padding:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px;text-align:center}
.shield{font-size:48px;margin-bottom:12px}
.title{font-size:18px;font-weight:700;margin-bottom:4px}
.sub{color:#8b949e;font-size:13px;margin-bottom:20px}
.amount-box{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:16px;margin-bottom:20px}
.amount-box .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.05em}
.amount-box .value{font-size:32px;font-weight:700;color:#fff;margin-top:4px}
.amount-box .desc{font-size:13px;color:#8b949e;margin-top:6px}
.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:13px;color:#c9d1d9;margin-bottom:6px}
.form-group input[type="tel"]{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:15px;outline:none;text-align:center;transition:.2s}
.form-group input[type="tel"]:focus{border-color:#58a6ff}
.checkbox-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;text-align:left}
.checkbox-row input[type="checkbox"]{margin-top:3px;accent-color:#238636;width:16px;height:16px;flex-shrink:0}
.checkbox-row label{font-size:12px;color:#8b949e;line-height:1.4;cursor:pointer}
.checkbox-row label a{color:#58a6ff;text-decoration:none}
.btn{width:100%;padding:14px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{background:#2ea043}
.btn:disabled{opacity:.4;cursor:not-allowed}
.footer{font-size:12px;color:#8b949e;margin-top:20px;text-align:center}
.badge{display:inline-block;background:#1a3d1f;color:#7ee787;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;margin-bottom:16px}
.error{background:#3d1f1f;border:1px solid #da3633;color:#ff7b72;padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.spinner{display:none;width:20px;height:20px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .8s linear infinite;margin:12px auto 0}
@keyframes spin{to{transform:rotate(360deg)}}
.success-icon{font-size:56px;margin-bottom:12px}
.success-screen{display:none}
.success-screen h2{font-size:20px;margin-bottom:8px;color:#7ee787}
.success-screen p{color:#8b949e;font-size:14px;margin-bottom:4px}
.success-screen .detail{color:#58a6ff;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<div class="card">

<div id="payment-screen">
<div class="shield">&#x1f6e1;&#xfe0f;</div>
<div class="badge">Secured by TrustLayer</div>
<h1 class="title">Complete your payment</h1>
<p class="sub">Your money is held securely until you confirm delivery</p>

<div class="amount-box">
<div class="label">Amount</div>
<div class="value" id="display-amount">--</div>
<div class="desc" id="display-desc">Loading deal details...</div>
</div>

<div id="error-box" class="error"></div>

<div class="form-group">
<label>M-Pesa phone number</label>
<input type="tel" id="phone" placeholder="2547XXXXXXXX" value="254">
</div>

<div class="checkbox-row">
<input type="checkbox" id="agree-checkbox">
<label for="agree-checkbox">I agree to the <a href="/terms/" target="_blank">Terms of Service</a> and <a href="/dispute-policy/" target="_blank">Dispute Policy</a>. I understand this payment is held in escrow until I confirm delivery.</label>
</div>

<button class="btn" id="pay-btn" onclick="pay()" disabled>&#x1f511; Pay Securely</button>
<div id="spinner" class="spinner"></div>
</div>

<div class="success-screen" id="success-screen">
<div class="success-icon">&#x2705;</div>
<h2>Payment Secured!</h2>
<p>Check your phone for the STK Push.</p>
<p>Enter your M-Pesa PIN to complete.</p>
<p class="detail" id="deal-code-display"></p>
</div>

</div>
<div class="footer">
TrustLayer &mdash; Safe payments. Real trust. Built for Africa.
</div>
</div>

<script>
var token = '{{ token }}';

document.getElementById('agree-checkbox').onchange = function() {
document.getElementById('pay-btn').disabled = !this.checked;
};

async function loadSession() {
try {
var res = await fetch('/api/v1/sessions/validate/' + token + '/');
var data = await res.json();
if (!data.valid) throw new Error('Invalid session');
document.getElementById('display-amount').textContent = 'KES ' + (data.session.amount || 0).toLocaleString();
document.getElementById('display-desc').textContent = data.session.description || 'Payment';
} catch(e) {
document.getElementById('display-desc').textContent = 'Invalid or expired payment link';
document.getElementById('pay-btn').disabled = true;
document.getElementById('agree-checkbox').disabled = true;
}
}

async function pay() {
var phone = document.getElementById('phone').value;
var btn = document.getElementById('pay-btn');
var spinner = document.getElementById('spinner');
var errorBox = document.getElementById('error-box');
errorBox.style.display = 'none';
btn.disabled = true;
spinner.style.display = 'block';
btn.textContent = 'Sending STK Push...';

try {
var res = await fetch('/api/v1/pay/initiate/', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({session_token: token, phone: phone})
});
var data = await res.json();
if (!res.ok) {
errorBox.textContent = data.error || 'Payment failed';
errorBox.style.display = 'block';
return;
}
document.getElementById('payment-screen').style.display = 'none';
document.getElementById('deal-code-display').textContent = 'Deal: ' + data.deal_code;
document.getElementById('success-screen').style.display = 'block';
} catch(e) {
errorBox.textContent = 'Network error. Try again.';
errorBox.style.display = 'block';
} finally {
btn.disabled = false;
spinner.style.display = 'none';
btn.textContent = 'Pay Securely';
}
}

loadSession();
</script>
</body>
</html>
