<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — Insurance & Organisation Platform</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center}
.container{width:100%;max-width:440px;padding:24px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:24px}
.logo span{font-size:32px}
.logo h1{font-size:22px;font-weight:800;margin-top:6px;color:#0f172a}
.logo p{font-size:13px;color:#64748b;margin-top:4px}
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:2px solid #e2e8f0}
.tab-btn{flex:1;padding:10px;background:transparent;border:none;color:#64748b;font-size:14px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;transition:.2s;margin-bottom:-2px}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb}
.tab-pane{display:none}
.tab-pane.active{display:block}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;color:#1e293b;font-size:14px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{background:#1d4ed8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.status-badge{display:inline-block;background:#f0fdf4;color:#059669;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;border:1px solid #bbf7d0}
.footer{text-align:center;margin-top:20px;font-size:12px;color:#94a3b8}
.spinner{display:none;width:18px;height:18px;border:2px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="logo">
<span>&#x1f6e1;&#xfe0f;</span>
<h1>TrustLayer</h1>
<p>Premium collection &amp; settlement for insurance organisations</p>
<span class="status-badge">&#x2705; Operational</span>
</div>

<div id="error-box" class="error"></div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('register')">Create account</button>
<button class="tab-btn" onclick="switchTab('login')">Sign in</button>
</div>

<div id="tab-register" class="tab-pane active">
<form id="register-form">
<div class="form-group">
<label>Business name</label>
<input type="text" id="reg-name" placeholder="Your business name" required>
</div>
<div class="form-group">
<label>Email address</label>
<input type="email" id="reg-email" placeholder="you@company.com" required>
</div>
<div class="form-group">
<label>Phone number</label>
<input type="tel" id="reg-phone" placeholder="0715641339 or +254715641339" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="reg-password" placeholder="At least 6 characters" minlength="6">
</div>
<div class="form-group">
<label>How do you want to receive payouts?</label>
<select id="reg-payout-method" style="width:100%;padding:10px 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;color:#1e293b;font-size:14px;outline:none" onchange="togglePayoutAccount()">
<option value="phone">Phone (M-Pesa B2C)</option>
<option value="pochi">Pochi la Biashara</option>
<option value="till" disabled>Till Number (Coming Soon)</option>
<option value="bank" disabled>Bank Transfer (Coming Soon)</option>
</select>
</div>
<div class="form-group" id="payout-account-group">
<label>Payout phone number</label>
<input type="tel" id="reg-payout-account" placeholder="2547XXXXXXXX (leave blank to use phone above)">
</div>
<button type="submit" class="btn" id="reg-btn">Create your account</button>
<div id="reg-spinner" class="spinner" style="margin-top:12px"></div>
</form>
</div>

<div id="tab-login" class="tab-pane">
<form id="login-form">
<div class="form-group">
<label>Email address</label>
<input type="email" id="login-email" placeholder="you@company.com" required>
</div>
<div class="form-group">
<label>Password</label>
<input type="password" id="login-password" placeholder="Your password" required>
</div>
<button type="submit" class="btn" id="login-btn">Sign in</button>
<div id="login-spinner" class="spinner" style="margin-top:12px"></div>
</form>
</div>

</div>
<div class="footer">
TrustLayer &mdash; Collect premiums. Settle claims. Built for Africa.
</div>
</div>

<script>
function togglePayoutAccount() {
var method = document.getElementById('reg-payout-method').value;
var group = document.getElementById('payout-account-group');
var input = document.getElementById('reg-payout-account');
if (method === 'phone' || method === 'pochi') {
group.style.display = 'block';
input.placeholder = method === 'phone' ? '2547XXXXXXXX (leave blank to use phone above)' : 'Pochi phone number 2547XXXXXXXX';
} else {
group.style.display = 'none';
}
}
function switchTab(tab) {
document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
document.querySelectorAll('.tab-pane').forEach(function(p) { p.classList.remove('active'); });
document.getElementById('tab-' + tab).classList.add('active');
document.querySelector('.tab-btn[onclick*="' + tab + '"]').classList.add('active');
document.getElementById('error-box').style.display = 'none';
}

function showError(msg) {
var el = document.getElementById('error-box');
el.textContent = msg;
el.style.display = 'block';
}

document.getElementById('register-form').onsubmit = async function(e) {
e.preventDefault();
var btn = document.getElementById('reg-btn');
var spinner = document.getElementById('reg-spinner');
showError('');
btn.disabled = true;
spinner.style.display = 'block';
btn.textContent = 'Creating account...';

try {
var res = await fetch('/register/', {
method: 'POST',
headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
body: JSON.stringify({
company_name: document.getElementById('reg-name').value,
email: document.getElementById('reg-email').value,
phone: document.getElementById('reg-phone').value,
password: document.getElementById('reg-password').value,
payout_method: document.getElementById('reg-payout-method').value,
payout_account: document.getElementById('reg-payout-account').value,
})
});
var text = await res.text();
var data;
try { data = JSON.parse(text); } catch(e) { return showError('Server error. Try again.'); }
if (!res.ok) {
var err = data.error;
var msg = typeof err === 'object' ? (err.company_name ? err.company_name[0] : err.email ? err.email[0] : err.phone ? err.phone[0] : 'Registration failed') : err;
return showError(msg);
}
window.location.href = data.redirect;
} catch(err) {
showError('Network error. Check your connection.');
} finally {
btn.disabled = false;
spinner.style.display = 'none';
btn.textContent = 'Create your account';
}
};

document.getElementById('login-form').onsubmit = async function(e) {
e.preventDefault();
var btn = document.getElementById('login-btn');
var spinner = document.getElementById('login-spinner');
showError('');
btn.disabled = true;
spinner.style.display = 'block';
btn.textContent = 'Signing in...';

try {
var res = await fetch('/login/', {
method: 'POST',
headers: {'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true'},
body: JSON.stringify({
email: document.getElementById('login-email').value,
password: document.getElementById('login-password').value,
})
});
var text = await res.text();
var data;
try { data = JSON.parse(text); } catch(e) { return showError('Server error. Try again.'); }
if (!res.ok) return showError(data.error || 'Login failed');
window.location.href = data.redirect;
} catch(err) {
showError('Network error. Check your connection.');
} finally {
btn.disabled = false;
spinner.style.display = 'none';
btn.textContent = 'Sign in';
}
};
</script>
</body>
</html>
