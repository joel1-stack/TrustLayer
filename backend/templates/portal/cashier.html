<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.container{max-width:500px;margin:0 auto;padding:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:16px}
.card h2{font-size:16px;font-weight:600;margin-bottom:16px;color:#c9d1d9}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:15px;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:#58a6ff}
.form-group textarea{resize:none;min-height:50px;font-family:inherit}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-outline{background:transparent;border:1px solid #30363d;color:#c9d1d9}
.btn-outline:hover{background:#21262d}
.error{background:#3d1f1f;border:1px solid #da3633;color:#ff7b72;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.success{background:#1a3d1f;border:1px solid #3fb950;color:#7ee787;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.qr-box{text-align:center;padding:20px;background:#0d1117;border:1px solid #30363d;border-radius:10px;margin-top:16px;display:none}
.qr-box canvas{margin:0 auto;display:block}
.qr-box .link-text{font-size:12px;color:#8b949e;margin-top:10px;word-break:break-all}
.qr-box .expiry{font-size:11px;color:#d29922;margin-top:4px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.amount-display{font-size:36px;font-weight:700;color:#fff;text-align:center;padding:12px 0;min-height:50px}
.amount-display .hint{font-size:13px;color:#8b949e;font-weight:400}
.recent-list{margin-top:12px}
.recent-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin-bottom:6px}
.recent-item .ri-amount{font-weight:600;font-size:14px}
.recent-item .ri-desc{font-size:12px;color:#8b949e}
.recent-item .ri-status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.s-held{background:#1a3d1f;color:#7ee787}
.s-pending{background:#3d2e00;color:#d29922}
.s-released{background:#1a3d1f;color:#7ee787}
.s-disputed{background:#3d1f1f;color:#ff7b72}
.nav-links{display:flex;gap:8px;margin-bottom:16px}
.nav-links a{color:#8b949e;font-size:13px;text-decoration:none;padding:6px 14px;border:1px solid #30363d;border-radius:6px}
.nav-links a.active{color:#58a6ff;border-color:#58a6ff}
</style>
</head>
<body>

<div class="topbar">
<div><h2>&#x1f4b0; TrustLayer POS</h2></div>
<div><a href="/portal/dashboard/" style="color:#8b949e;font-size:13px;text-decoration:none">Dashboard</a></div>
</div>

<div class="container">

<div class="nav-links">
<a href="#" class="active" onclick="showMode('payment')">&#x1f4b3; New Payment</a>
<a href="#" onclick="showMode('recent')">&#x1f4cb; Recent</a>
</div>

<div id="mode-payment">
<div class="card">
<h2>&#x1f4b3; Create Payment Link</h2>
<div id="error-box" class="error"></div>
<div id="success-box" class="success"></div>

<div class="form-group">
<label>Customer phone</label>
<input type="tel" id="cust-phone" placeholder="0712345678" autofocus>
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="cust-amount" placeholder="e.g. 500" min="100" max="500000">
</div>
<div class="form-group">
<label>What are they paying for?</label>
<textarea id="cust-desc" placeholder="e.g. Wash & Fold - 3kg">Payment</textarea>
</div>
<button class="btn btn-primary" id="gen-btn" onclick="generateQR()">&#x1f4f1; Generate Payment QR</button>
</div>

<!-- QR Code -->
<div class="qr-box" id="qr-box">
<div id="qr-amount-label" class="amount-display"><span class="hint">Payment QR</span></div>
<canvas id="qr-canvas"></canvas>
<p class="link-text" id="qr-link"></p>
<p class="expiry" id="qr-expiry"></p>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-primary" style="flex:1" onclick="sendSMS()">&#x1f4f2; Send SMS</button>
<button class="btn btn-outline" style="flex:1" onclick="resetForm()">&#x1f504; New</button>
</div>
<div id="send-status" style="font-size:12px;color:#8b949e;margin-top:8px"></div>
</div>
</div>

<div id="mode-recent" style="display:none">
<div class="card">
<h2>&#x1f4cb; Recent Transactions</h2>
<div id="recent-list"><p style="color:#8b949e;font-size:13px">Loading...</p></div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
var baseURL = window.location.origin;
var currentSessionCode = '';
var currentPhone = '';
var currentAmount = 0;

function $(id) { return document.getElementById(id); }

function showError(m) { var e=$('error-box'); e.textContent=m; e.style.display='block'; }
function hideError() { $('error-box').style.display='none'; $('success-box').style.display='none'; }
function showSuccess(m) { var e=$('success-box'); e.textContent=m; e.style.display='block'; }

function showMode(m) {
document.querySelectorAll('.nav-links a').forEach(function(a){a.classList.remove('active')});
document.querySelectorAll('[id^=mode-]').forEach(function(d){d.style.display='none';});
$('mode-'+m).style.display='block';
event.target.classList.add('active');
if (m==='recent') loadRecent();
}

function formatPhone(p) {
p = p.replace(/[^0-9]/g,'');
if (p.startsWith('0')) p = '254' + p.substring(1);
else if (!p.startsWith('254')) p = '254' + p;
return p;
}

// ── Generate QR ──
async function generateQR() {
hideError();
var phone = $('cust-phone').value.trim();
var amount = $('cust-amount').value;
var desc = $('cust-desc').value.trim() || 'Payment';

if (!phone) return showError('Enter customer phone number');
if (!amount || amount < 100) return showError('Minimum amount is KES 100');

phone = formatPhone(phone);
currentPhone = phone;
currentAmount = amount;

var btn = $('gen-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating payment link...';

try {
var res = await fetch('/api/proxy/create-session/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount),description:desc})
});
var d = await res.json();
if (d.error) return showError(d.error);

currentSessionCode = d.short_code;
var payURL = baseURL + '/pay/' + d.short_code + '/';
var mins = Math.floor(d.expires_in_seconds / 60);

// Show QR
$('qr-box').style.display = 'block';
$('qr-amount-label').innerHTML = 'KES ' + Number(amount).toLocaleString();
$('qr-link').textContent = payURL;
$('qr-expiry').textContent = 'Expires in ' + mins + ' minutes';

// Generate QR
$('qr-canvas').innerHTML = '';
try { new QRCode($('qr-canvas'), {text:payURL,width:200,height:200}); } catch(e) {}

showSuccess('Payment link created! Scan or share with customer.');
loadRecent();
} catch(e) { showError('Failed to create payment link.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4f1; Generate Payment QR'; }
}

// ── Send SMS ──
async function sendSMS() {
if (!currentSessionCode) return;
$('send-status').textContent = 'Sending...';
try {
var res = await fetch('/api/v1/sessions/create/', {
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({session_code:currentSessionCode, phone:currentPhone})
});
var d = await res.json();
$('send-status').textContent = d.success ? '&#x2705; SMS sent!' : 'SMS service unavailable';
} catch(e) { $('send-status').textContent = 'Failed to send SMS'; }
}

function resetForm() {
$('cust-phone').value = '';
$('cust-amount').value = '';
$('cust-desc').value = 'Payment';
$('qr-box').style.display = 'none';
$('error-box').style.display = 'none';
$('success-box').style.display = 'none';
$('cust-phone').focus();
}

// ── Load Recent ──
async function loadRecent() {
try {
var res = await fetch('/api/proxy/deals/', {headers:{'ngrok-skip-browser-warning':'true'}});
var d = await res.json();
var deals = (d.deals || []).slice(0,10);
var el = $('recent-list');
if (!deals.length) { el.innerHTML = '<p style="color:#8b949e;font-size:13px">No transactions yet.</p>'; return; }
el.innerHTML = deals.map(function(dl){
var sc = 's-' + dl.status.toLowerCase();
return '<div class="recent-item"><div><div class="ri-amount">KES ' + Number(dl.amount||0).toLocaleString() + '</div><div class="ri-desc">' + (dl.description||'').substring(0,30) + '</div></div><span class="ri-status ' + sc + '">' + dl.status + '</span></div>';
}).join('');
} catch(e) { $('recent-list').innerHTML = '<p style="color:#8b949e;font-size:13px">Failed to load.</p>'; }
}

// ── Init ──
loadRecent();
$('cust-amount').addEventListener('keydown', function(e){if(e.key==='Enter')generateQR();});
$('cust-phone').focus();
</script>
</body>
</html>
