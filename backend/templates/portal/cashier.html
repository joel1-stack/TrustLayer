<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — POS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{font-size:14px;font-weight:700}
.topbar .biz-name{color:#58a6ff;font-size:12px}
.topbar .logout{color:#8b949e;font-size:12px;text-decoration:none}
.container{max-width:500px;margin:0 auto;padding:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:12px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px;color:#c9d1d9}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:#8b949e;margin-bottom:4px;font-weight:500}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:15px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#58a6ff}
.form-group textarea{resize:none;min-height:44px;font-family:inherit}
.form-group select option{background:#161b22}
.btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:#238636;color:#fff}
.btn-primary:hover{background:#2ea043}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-large{font-size:18px;padding:18px}
.btn-outline{background:transparent;border:1px solid #30363d;color:#c9d1d9}
.btn-outline:hover{background:#21262d}
.error{background:#3d1f1f;border:1px solid #da3633;color:#ff7b72;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.success{background:#1a3d1f;border:1px solid #3fb950;color:#7ee787;padding:10px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.screen{display:none}
.screen.active{display:block}
.pin-display{font-size:36px;letter-spacing:12px;text-align:center;padding:16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;margin-bottom:12px;min-height:56px;color:#58a6ff;font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.pad-btn{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:18px;font-size:24px;color:#e6edf3;cursor:pointer;text-align:center;font-weight:600}
.pad-btn:hover{background:#30363d}
.pad-btn-zero{grid-column:span 1}
.qr-box{text-align:center;padding:16px;background:#0d1117;border:1px solid #30363d;border-radius:10px;margin-top:12px;display:none}
.qr-box canvas{margin:0 auto;display:block}
.qr-box .amount-label{font-size:28px;font-weight:700;color:#fff;margin-bottom:8px}
.qr-box .link-text{font-size:11px;color:#8b949e;margin-top:8px;word-break:break-all}
.qr-box .expiry{font-size:11px;color:#d29922;margin-top:4px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.success-icon{font-size:56px;margin-bottom:8px}
.receipt{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:20px;margin-top:12px;font-size:13px;line-height:1.6}
.receipt .r-header{text-align:center;margin-bottom:12px}
.receipt .r-header h3{font-size:14px;color:#fff}
.receipt .r-header p{font-size:11px;color:#8b949e}
.receipt .r-line{border-top:1px dashed #30363d;margin:8px 0}
.receipt .r-row{display:flex;justify-content:space-between;font-size:12px}
.receipt .r-total{font-size:16px;font-weight:700;color:#fff}
.receipt .r-code{color:#58a6ff;font-size:11px}
.amount-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.amt-btn{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:14px;font-size:16px;color:#e6edf3;cursor:pointer;text-align:center;font-weight:600}
.amt-btn:hover{background:#30363d}
.amt-btn.selected{border-color:#58a6ff;background:#1f2330}
.pin-header{text-align:center;margin-bottom:20px}
.pin-header .icon{font-size:40px}
.pin-header h2{font-size:18px;color:#fff;margin-top:8px}
.pin-header p{color:#8b949e;font-size:13px;margin-top:4px}
@media print{body{background:#fff;color:#000}.topbar,.container .card:not(.receipt),.btn,.no-print{display:none!important}.container{max-width:300px;padding:0}.receipt{border:none;padding:0;background:#fff;color:#000}.receipt .r-code{color:#000}}
</style>
</head>
<body>

<div class="topbar">
<div><h2>&#x1f4b0; TrustLayer POS</h2> <span class="biz-name" id="topbar-biz"></span></div>
<div><a href="#" class="logout" id="logout-btn" onclick="logout()" style="display:none">Logout</a></div>
</div>

<div class="container">

<div id="error-box" class="error"></div>
<div id="success-box" class="success"></div>

<!-- Screen: PIN Login -->
<div class="screen active" id="screen-login">
<div class="card">
<div class="pin-header">
<div class="icon">&#x1f510;</div>
<h2>Cashier Login</h2>
<p>Enter your business PIN</p>
</div>
<div class="pin-display" id="pin-display"></div>
<div class="pad" id="pin-pad">
<div class="pad-btn" onclick="pinPress('1')">1</div>
<div class="pad-btn" onclick="pinPress('2')">2</div>
<div class="pad-btn" onclick="pinPress('3')">3</div>
<div class="pad-btn" onclick="pinPress('4')">4</div>
<div class="pad-btn" onclick="pinPress('5')">5</div>
<div class="pad-btn" onclick="pinPress('6')">6</div>
<div class="pad-btn" onclick="pinPress('7')">7</div>
<div class="pad-btn" onclick="pinPress('8')">8</div>
<div class="pad-btn" onclick="pinPress('9')">9</div>
<div class="pad-btn pad-btn-zero" onclick="pinPress('0')">0</div>
<div class="pad-btn" onclick="pinPress('del')" style="font-size:14px">&#x232b;</div>
<div class="pad-btn" onclick="pinPress('ok')" style="background:#238636;color:#fff;border-color:#238636">&#x2705;</div>
</div>
</div>
</div>

<!-- Screen: Order Entry -->
<div class="screen" id="screen-order">
<div class="card">
<h2>&#x1f4b3; New Order</h2>
<div class="form-group">
<label>Customer phone (optional)</label>
<input type="tel" id="cust-phone" placeholder="0712345678">
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="cust-amount" placeholder="e.g. 500" min="100" max="500000">
</div>
<div class="amount-grid" id="quick-amounts">
<div class="amt-btn" onclick="setAmount(100)">100</div>
<div class="amt-btn" onclick="setAmount(200)">200</div>
<div class="amt-btn" onclick="setAmount(500)">500</div>
<div class="amt-btn" onclick="setAmount(1000)">1,000</div>
<div class="amt-btn" onclick="setAmount(2000)">2,000</div>
<div class="amt-btn" onclick="setAmount(5000)">5,000</div>
</div>
<div class="form-group">
<label>What are they paying for?</label>
<textarea id="cust-desc" placeholder="e.g. Wash & Fold - 3kg">Payment</textarea>
</div>
<button class="btn btn-primary btn-large" id="order-btn" onclick="createOrder()">&#x1f4f1; Generate QR</button>
</div>

<!-- QR Code -->
<div class="qr-box" id="qr-box">
<div class="amount-label" id="qr-amount-label">KES 0</div>
<canvas id="qr-canvas"></canvas>
<p class="link-text" id="qr-link"></p>
<p class="expiry" id="qr-expiry"></p>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn btn-primary" style="flex:1" id="poll-btn" onclick="startPolling()">&#x1f504; Check Payment</button>
<button class="btn btn-outline" style="flex:1" onclick="newOrder()">&#x1f504; New Order</button>
</div>
<div id="poll-status" style="font-size:12px;color:#8b949e;margin-top:8px"></div>
</div>
</div>

<!-- Screen: Success / Receipt -->
<div class="screen" id="screen-success">
<div class="card">
<div class="success-icon" style="text-align:center">&#x2705;</div>
<h2 style="text-align:center;color:#3fb950;font-size:18px">Payment Successful!</h2>
<p style="text-align:center;color:#8b949e;font-size:13px;margin-top:4px" id="success-msg">KES 0 received</p>

<div class="receipt" id="receipt-area">
<div class="r-header">
<h3>TrustLayer</h3>
<p id="receipt-biz">Business Name</p>
<p id="receipt-date"></p>
</div>
<div class="r-line"></div>
<div class="r-row"><span>Item</span><span id="receipt-desc">Payment</span></div>
<div class="r-row"><span>Amount</span><span class="r-total" id="receipt-amount">KES 0</span></div>
<div class="r-line"></div>
<div class="r-row"><span>Status</span><span style="color:#3fb950">PAID</span></div>
<div class="r-row"><span>Deal Code</span><span class="r-code" id="receipt-code">---</span></div>
<div class="r-row"><span>Time</span><span id="receipt-time"></span></div>
</div>

<div class="no-print" style="display:flex;gap:8px;margin-top:12px">
<button class="btn btn-primary" style="flex:1" onclick="printReceipt()">&#x1f5a8; Print Receipt</button>
<button class="btn btn-outline" style="flex:1" onclick="newOrder()">&#x1f504; New Order</button>
</div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
var baseURL = window.location.origin;
var cashierSessionId = localStorage.getItem('tl_cashier_session') || '';
var cashierBizId = localStorage.getItem('tl_cashier_biz_id') || '';
var cashierBizName = localStorage.getItem('tl_cashier_biz_name') || '';
var pinBuffer = '';
var currentDealCode = '';
var currentAmount = 0;
var pollInterval = null;

function $(id) { return document.getElementById(id); }
function showError(m) { var e=$('error-box'); e.textContent=m; e.style.display='block'; }
function hideError() { $('error-box').style.display='none'; $('success-box').style.display='none'; }
function showScreen(id) { document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')}); $(id).classList.add('active'); }

// ── PIN Login ──
function pinPress(key) {
if (key === 'del') { pinBuffer = pinBuffer.slice(0,-1); }
else if (key === 'ok') { submitPin(); return; }
else { if (pinBuffer.length >= 6) return; pinBuffer += key; }
$('pin-display').textContent = pinBuffer.replace(/./g,'&#x2022;');
}

async function submitPin() {
if (pinBuffer.length < 3) return showError('Enter at least 3 digits');
hideError();
try {
var res = await fetch('/api/proxy/cashier-login/', {
method:'POST', headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({pin:pinBuffer})
});
var d = await res.json();
if (d.error) { showError(d.error); pinBuffer=''; $('pin-display').textContent=''; return; }
cashierSessionId = d.session_id;
cashierBizId = d.business.id;
cashierBizName = d.business.name + ' — ' + d.business.organization;
localStorage.setItem('tl_cashier_session', cashierSessionId);
localStorage.setItem('tl_cashier_biz_id', cashierBizId);
localStorage.setItem('tl_cashier_biz_name', cashierBizName);
$('topbar-biz').textContent = d.business.name;
$('logout-btn').style.display = 'inline';
showScreen('screen-order');
pinBuffer = '';
} catch(e) { showError('Connection error'); pinBuffer=''; $('pin-display').textContent=''; }
}

function logout() {
localStorage.removeItem('tl_cashier_session');
localStorage.removeItem('tl_cashier_biz_id');
localStorage.removeItem('tl_cashier_biz_name');
cashierSessionId = '';
showScreen('screen-login');
$('logout-btn').style.display = 'none';
$('topbar-biz').textContent = '';
}

// ── Quick Amount ──
function setAmount(n) {
$('cust-amount').value = n;
document.querySelectorAll('.amt-btn').forEach(function(b){b.classList.remove('selected')});
event.target.classList.add('selected');
}

// ── Create Order → QR ──
async function createOrder() {
hideError();
var phone = $('cust-phone').value.trim() || '254715641339';
var amount = $('cust-amount').value;
var desc = $('cust-desc').value.trim() || 'Payment';

if (!amount || amount < 100) return showError('Minimum amount is KES 100');
currentAmount = amount;

phone = phone.replace(/[^0-9]/g,'');
if (phone.startsWith('0')) phone = '254' + phone.substring(1);
else if (!phone.startsWith('254')) phone = '254' + phone;

var btn = $('order-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';

try {
var res = await fetch('/api/proxy/create-session/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount),description:desc})
});
var d = await res.json();
if (d.error) return showError(d.error);

currentDealCode = d.short_code;
var payURL = baseURL + '/pay/' + d.short_code + '/';
var mins = Math.floor((d.expires_in_seconds||900) / 60);

$('qr-box').style.display = 'block';
$('qr-amount-label').textContent = 'KES ' + Number(amount).toLocaleString();
$('qr-link').textContent = payURL;
$('qr-expiry').textContent = 'Expires in ' + mins + ' min';
$('qr-canvas').innerHTML = '';
try { new QRCode($('qr-canvas'), {text:payURL,width:200,height:200}); } catch(e) {}

$('poll-status').textContent = 'Waiting for customer to scan & pay...';
startPolling();
} catch(e) { showError('Failed to create order.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4f1; Generate QR'; }
}

// ── Poll for Payment ──
function startPolling() {
if (pollInterval) clearInterval(pollInterval);
$('poll-status').textContent = 'Checking payment status...';
pollInterval = setInterval(async function() {
if (!currentDealCode) return;
try {
var res = await fetch('/api/v1/sessions/validate/' + currentDealCode + '/');
var d = await res.json();
if (d.valid && d.session && d.session.deal_code && d.session.deal_status !== 'PENDING') {
clearInterval(pollInterval);
pollInterval = null;
showSuccessScreen(d.session);
}
} catch(e) {}
}, 3000);
// Auto-stop after 5 minutes
setTimeout(function(){if(pollInterval){clearInterval(pollInterval);pollInterval=null;$('poll-status').textContent='Timed out. Click Check Payment to retry.';}},300000);
}

// ── Success Screen ──
function showSuccessScreen(session) {
var amt = session.amount || currentAmount;
$('success-msg').textContent = 'KES ' + Number(amt).toLocaleString() + ' received';
$('receipt-biz').textContent = cashierBizName || 'TrustLayer Merchant';
$('receipt-desc').textContent = session.description || 'Payment';
$('receipt-amount').textContent = 'KES ' + Number(amt).toLocaleString();
$('receipt-code').textContent = session.deal_code || currentDealCode;
var now = new Date();
$('receipt-date').textContent = now.toLocaleDateString();
$('receipt-time').textContent = now.toLocaleTimeString();
showScreen('screen-success');
}

function printReceipt() { window.print(); }

function newOrder() {
if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
$('cust-phone').value = '';
$('cust-amount').value = '';
$('cust-desc').value = 'Payment';
$('qr-box').style.display = 'none';
currentDealCode = '';
showScreen('screen-order');
}

// ── Init ──
if (cashierSessionId) {
$('topbar-biz').textContent = cashierBizName;
$('logout-btn').style.display = 'inline';
showScreen('screen-order');
}
</script>
</body>
</html>
