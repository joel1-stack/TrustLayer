<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.topbar h2{font-size:16px;font-weight:800;color:#0f172a}
.topbar span{color:#64748b;font-size:12px}
.container{max-width:900px;margin:0 auto;padding:24px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.stat-card .label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-card .value{font-size:24px;font-weight:700;margin-top:4px}
.stat-card .sub{font-size:11px;color:#94a3b8;margin-top:2px}
.blue{color:#2563eb}.green{color:#059669}.orange{color:#d97706}.red{color:#dc2626}.purple{color:#7c3aed}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:15px;font-weight:700;margin-bottom:16px;color:#0f172a}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;color:#475569;margin-bottom:4px;font-weight:600}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;color:#1e293b;font-size:14px;outline:none;transition:.2s}
.form-group input:focus,.form-group select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{background:#2563eb;color:#fff;border:none;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{background:#1d4ed8}
.btn-sm{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer;transition:.2s}
.btn-sm:hover{background:#e2e8f0}
.btn-outline{background:transparent;color:#2563eb;border:1px solid #2563eb;padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-outline:hover{background:#eff6ff}
.deal-item{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px 16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.deal-item .info{flex:1}
.deal-item .code{font-size:12px;color:#64748b}
.deal-item .desc{font-size:13px;color:#1e293b;margin-top:2px}
.deal-item .amount{font-size:15px;font-weight:700;text-align:right}
.deal-item .status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:700;margin-left:8px}
.s-pending{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.s-payment_initiated{background:#fffbeb;color:#d97706;border:1px solid #fde68a}
.s-held{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}
.s-delivered{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}
.s-released{background:#f0fdf4;color:#059669;border:1px solid #bbf7d0}
.s-disputed{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.s-cancelled{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
.empty{color:#94a3b8;font-size:13px;text-align:center;padding:24px 0}
.error{background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.success-msg{background:#f0fdf4;border:1px solid #86efac;color:#059669;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.qr-box{text-align:center;padding:24px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin-top:12px;display:none}
.qr-box canvas{margin:0 auto;display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
a{text-decoration:none}
</style>
</head>
<body>

<div class="topbar">
<div><h2>&#x1f6e1;&#xfe0f; TrustLayer</h2></div>
<div><span id="business-name">Dashboard</span> &nbsp; <a href="/portal/cashier/" style="color:#2563eb;font-size:12px;font-weight:600">POS</a> &nbsp; <a href="/portal/onboard/" style="color:#d97706;font-size:12px;font-weight:600">Settings</a> &nbsp; <a href="/" style="color:#94a3b8;font-size:12px">Logout</a></div>
</div>

<div class="container">

<div id="error-box" class="error"></div>
<div id="success-box" class="success-msg"></div>

<div class="stats-grid" id="stats-grid">
<div class="stat-card"><div class="label">Today's Revenue</div><div class="value blue" id="stat-revenue">—</div></div>
<div class="stat-card"><div class="label">Pending Settlement</div><div class="value orange" id="stat-pending">—</div></div>
<div class="stat-card"><div class="label">Settled</div><div class="value green" id="stat-settled">—</div></div>
<div class="stat-card"><div class="label">Platform Fees</div><div class="value purple" id="stat-fees">—</div></div>
</div>

<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
<button class="btn" onclick="showTab('pos')">&#x1f4b3; New Payment</button>
<button class="btn-outline" onclick="showTab('transactions')">&#x1f4cb; Transactions</button>
<button class="btn-outline" onclick="showTab('wallet')">&#x1f4b0; Withdraw</button>
<a href="/portal/cashier/"><button class="btn-outline">&#x1f4b3; POS (Cashier)</button></a>
</div>

<div id="tab-pos" class="card">
<h3>&#x1f4b3; Collect Premium (M-Pesa STK Push)</h3>
<div class="form-group">
<label>Customer phone</label>
<input type="tel" id="customer-phone" placeholder="0712345678">
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="pay-amount" placeholder="e.g. 500" min="1">
</div>
<div class="form-group">
<label>Description (optional)</label>
<input type="text" id="pay-desc" placeholder="e.g. Premium Payment">
</div>
<button class="btn" id="pay-btn" onclick="collectPayment()">&#x1f4f1; Send STK Push</button>
<div id="pay-status" style="margin-top:12px"></div>
</div>

<div id="tab-transactions" class="card" style="display:none">
<h3>&#x1f4cb; Recent Transactions</h3>
<div id="deals-list"><div class="empty">Loading...</div></div>
</div>

<div id="tab-wallet" class="card" style="display:none">
<h3>&#x1f4b0; Withdraw to M-Pesa</h3>
<div class="stats-grid" style="margin-bottom:12px">
<div class="stat-card"><div class="label">Available Balance</div><div class="value green" id="wallet-balance">—</div></div>
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="withdraw-amount" placeholder="Enter amount to withdraw">
</div>
<div class="form-group">
<label>Send to</label>
<input type="tel" id="withdraw-phone" placeholder="254715641339">
</div>
<button class="btn" id="withdraw-btn" onclick="withdrawFunds()">&#x1f4b8; Withdraw</button>
</div>

</div>

<script>
var apiKey = new URLSearchParams(window.location.search).get('key') || '';
if (apiKey) { localStorage.setItem('tl_api_key', apiKey); }

function $(id) { return document.getElementById(id); }
function showError(m) { var e=$('error-box'); e.textContent=m; e.style.display='block'; }
function hideError() { $('error-box').style.display='none'; }
function showSuccess(m) { var e=$('success-box'); e.textContent=m; e.style.display='block'; setTimeout(function(){e.style.display='none';},5000); }

function showTab(t) {
document.querySelectorAll('.card[id^=tab-]').forEach(function(e){e.style.display='none';});
$('tab-'+t).style.display='block';
hideError();
}

async function loadStats() {
try {
var res = await fetch('/api/stats/', {headers:{'ngrok-skip-browser-warning':'true'}});
var d = await res.json();
if (!d.success) return;
var s = d.data;
$('stat-revenue').textContent = 'KES ' + Number(s.today_revenue||0).toLocaleString();
$('stat-pending').textContent = 'KES ' + Number(s.pending_settlement||0).toLocaleString();
$('stat-settled').textContent = 'KES ' + Number(s.already_settled||0).toLocaleString();
$('stat-fees').textContent = 'KES ' + Number(s.platform_fees||0).toLocaleString();
$('wallet-balance').textContent = 'KES ' + Number(s.wallet_balance||0).toLocaleString();
} catch(e) {}
}

async function loadDeals() {
try {
var res = await fetch('/api/proxy/deals/', {headers:{'ngrok-skip-browser-warning':'true'}});
var d = await res.json();
var deals = (d.deals || []).slice(0,30);
var el = $('deals-list');
if (!deals.length) { el.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }
el.innerHTML = deals.map(function(dl){
var sc = 's-' + dl.status.toLowerCase();
return '<div class="deal-item"><div class="info"><div class="code">' + dl.deal_code + '</div><div class="desc">' + (dl.description||'').substring(0,50) + '</div></div><div style="text-align:right"><div class="amount">KES ' + Number(dl.amount||0).toLocaleString() + '</div><span class="status ' + sc + '">' + dl.status + '</span></div></div>';
}).join('');
} catch(e) { $('deals-list').innerHTML = '<div class="empty">Failed to load transactions.</div>'; }
}

async function collectPayment() {
hideError();
var phone = $('customer-phone').value.trim();
var amount = $('pay-amount').value;
var desc = $('pay-desc').value || 'Payment';
if (!phone || !amount) return showError('Phone and amount required');

phone = phone.replace(/[^0-9]/g,'');
if (phone.startsWith('0')) phone = '254' + phone.substring(1);
else if (!phone.startsWith('254')) phone = '254' + phone;

var btn = $('pay-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';

try {
var res = await fetch('/api/proxy/collect/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount),description:desc})
});
var d = await res.json();
if (d.error) return showError(d.error);
$('pay-status').innerHTML = '<span style="color:#059669">&#x2705; STK Push sent to ' + phone + '.</span><br><span style="color:#64748b;font-size:12px">Ask customer to check phone and enter PIN.</span>';
showSuccess('Payment request sent!');
loadDeals();
} catch(e) { showError('Failed to send payment request.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4f1; Send STK Push'; }
}

async function withdrawFunds() {
hideError();
var amount = $('withdraw-amount').value;
var phone = $('withdraw-phone').value.trim() || '254715641339';
if (!amount) return showError('Enter amount to withdraw');

phone = phone.replace(/[^0-9]/g,'');
if (phone.startsWith('0')) phone = '254' + phone.substring(1);
else if (!phone.startsWith('254')) phone = '254' + phone;

var btn = $('withdraw-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Processing...';

try {
var res = await fetch('/api/proxy/withdraw/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount)})
});
var d = await res.json();
if (d.error) return showError(d.error);
showSuccess('Withdrawal of KES ' + amount + ' queued to ' + phone);
loadStats();
} catch(e) { showError('Failed to process withdrawal.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4b8; Withdraw'; }
}

loadStats();
loadDeals();
setInterval(loadStats, 30000);
setInterval(loadDeals, 15000);
</script>
</body>
</html>
