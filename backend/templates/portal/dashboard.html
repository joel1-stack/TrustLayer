<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustLayer — Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh}
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar h2{font-size:15px;font-weight:700}
.topbar span{color:#8b949e;font-size:12px}
.container{max-width:900px;margin:0 auto;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:16px}
.stat-card .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.stat-card .value{font-size:22px;font-weight:700;margin-top:4px}
.stat-card .sub{font-size:11px;color:#8b949e;margin-top:2px}
.blue{color:#58a6ff}.green{color:#3fb950}.orange{color:#d29922}.red{color:#f85149}.purple{color:#bc8cff}
.card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;margin-bottom:16px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px;color:#c9d1d9}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;color:#8b949e;margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:10px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;font-size:14px;outline:none}
.form-group input:focus,.form-group select:focus{border-color:#58a6ff}
.btn{background:#238636;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:#2ea043}
.btn-sm{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#30363d}
.btn-outline{background:transparent;color:#58a6ff;border:1px solid #58a6ff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
.btn-outline:hover{background:#1f2330}
.deal-item{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.deal-item .info{flex:1}
.deal-item .code{font-size:12px;color:#8b949e}
.deal-item .desc{font-size:13px;color:#e6edf3;margin-top:2px}
.deal-item .amount{font-size:15px;font-weight:600;text-align:right}
.deal-item .status{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:8px}
.s-pending{background:#3d2e00;color:#d29922}
.s-payment_initiated{background:#3d2e00;color:#d29922}
.s-held{background:#1a3d1f;color:#7ee787}
.s-delivered{background:#1a3d1f;color:#7ee787}
.s-released{background:#1a3d1f;color:#7ee787}
.s-disputed{background:#3d1f1f;color:#ff7b72}
.s-cancelled{background:#3d1f1f;color:#ff7b72}
.empty{color:#8b949e;font-size:13px;text-align:center;padding:24px 0}
.error{background:#3d1f1f;border:1px solid #da3633;color:#ff7b72;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.success-msg{background:#1a3d1f;border:1px solid #3fb950;color:#7ee787;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.qr-box{text-align:center;padding:24px;background:#0d1117;border:1px solid #30363d;border-radius:10px;margin-top:12px;display:none}
.qr-box canvas{margin:0 auto;display:block}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
<div><h2>&#x1f6e1;&#xfe0f; TrustLayer</h2></div>
<div><span id="business-name">Dashboard</span> &nbsp; <a href="/" style="color:#8b949e;font-size:12px;text-decoration:none">Logout</a></div>
</div>

<div class="container">

<div id="error-box" class="error"></div>
<div id="success-box" class="success-msg"></div>

<!-- Stats Grid -->
<div class="stats-grid" id="stats-grid">
<div class="stat-card"><div class="label">Today's Revenue</div><div class="value blue" id="stat-revenue">—</div></div>
<div class="stat-card"><div class="label">Pending Settlement</div><div class="value orange" id="stat-pending">—</div></div>
<div class="stat-card"><div class="label">Settled</div><div class="value green" id="stat-settled">—</div></div>
<div class="stat-card"><div class="label">Platform Fees</div><div class="value purple" id="stat-fees">—</div></div>
</div>

<!-- Quick Actions -->
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
<button class="btn" onclick="showTab('pos')">&#x1f4b3; New Payment</button>
<button class="btn-outline" onclick="showTab('deals')">&#x1f4cb; Transactions</button>
<button class="btn-outline" onclick="showTab('wallet')">&#x1f4b0; Withdraw</button>
</div>

<!-- POS / Cashier Tab -->
<div id="tab-pos" class="card">
<h3>&#x1f4b3; Collect Payment (M-Pesa STK Push)</h3>
<div class="form-group">
<label>Customer phone</label>
<input type="tel" id="customer-phone" placeholder="0712345678">
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="pay-amount" placeholder="e.g. 500" min="1">
</div>
<div class="form-group">
<label>Description (optional)</label>
<input type="text" id="pay-desc" placeholder="e.g. Wash & Fold">
</div>
<button class="btn" id="pay-btn" onclick="collectPayment()">&#x1f4f1; Send STK Push</button>
<div id="pay-status" style="margin-top:12px"></div>
</div>

<!-- Deals Tab -->
<div id="tab-deals" class="card" style="display:none">
<h3>&#x1f4cb; Recent Transactions</h3>
<div id="deals-list"><div class="empty">Loading...</div></div>
</div>

<!-- Wallet / Withdraw Tab -->
<div id="tab-wallet" class="card" style="display:none">
<h3>&#x1f4b0; Withdraw to M-Pesa</h3>
<div class="stats-grid" style="margin-bottom:12px">
<div class="stat-card"><div class="label">Available Balance</div><div class="value green" id="wallet-balance">—</div></div>
</div>
<div class="form-group">
<label>Amount (KES)</label>
<input type="number" id="withdraw-amount" placeholder="Enter amount to withdraw">
</div>
<div class="form-group">
<label>Send to</label>
<input type="tel" id="withdraw-phone" placeholder="254715641339">
</div>
<button class="btn" id="withdraw-btn" onclick="withdrawFunds()">&#x1f4b8; Withdraw</button>
</div>

</div>

<script>
var apiKey = new URLSearchParams(window.location.search).get('key') || '';
if (apiKey) { localStorage.setItem('tl_api_key', apiKey); }

function $(id) { return document.getElementById(id); }
function showError(m) { var e=$('error-box'); e.textContent=m; e.style.display='block'; }
function hideError() { $('error-box').style.display='none'; }
function showSuccess(m) { var e=$('success-box'); e.textContent=m; e.style.display='block'; setTimeout(function(){e.style.display='none';},5000); }

function showTab(t) {
document.querySelectorAll('.card[id^=tab-]').forEach(function(e){e.style.display='none';});
$('tab-'+t).style.display='block';
hideError();
}

// ── Load Stats ──
async function loadStats() {
try {
var res = await fetch('/api/stats/', {headers:{'ngrok-skip-browser-warning':'true'}});
var d = await res.json();
if (!d.success) return;
var s = d.data;
$('stat-revenue').textContent = 'KES ' + Number(s.today_revenue||0).toLocaleString();
$('stat-pending').textContent = 'KES ' + Number(s.pending_settlement||0).toLocaleString();
$('stat-settled').textContent = 'KES ' + Number(s.already_settled||0).toLocaleString();
$('stat-fees').textContent = 'KES ' + Number(s.platform_fees||0).toLocaleString();
$('wallet-balance').textContent = 'KES ' + Number(s.wallet_balance||0).toLocaleString();
} catch(e) {}
}

// ── Load Deals ──
async function loadDeals() {
try {
var res = await fetch('/api/proxy/deals/', {headers:{'ngrok-skip-browser-warning':'true'}});
var d = await res.json();
var deals = (d.deals || []).slice(0,30);
var el = $('deals-list');
if (!deals.length) { el.innerHTML = '<div class="empty">No transactions yet.</div>'; return; }
el.innerHTML = deals.map(function(dl){
var sc = 's-' + dl.status.toLowerCase();
return '<div class="deal-item"><div class="info"><div class="code">' + dl.deal_code + '</div><div class="desc">' + (dl.description||'').substring(0,50) + '</div></div><div style="text-align:right"><div class="amount">KES ' + Number(dl.amount||0).toLocaleString() + '</div><span class="status ' + sc + '">' + dl.status + '</span></div></div>';
}).join('');
} catch(e) { $('deals-list').innerHTML = '<div class="empty">Failed to load transactions.</div>'; }
}

// ── Collect Payment ──
async function collectPayment() {
hideError();
var phone = $('customer-phone').value.trim();
var amount = $('pay-amount').value;
var desc = $('pay-desc').value || 'Payment';
if (!phone || !amount) return showError('Phone and amount required');

phone = phone.replace(/[^0-9]/g,'');
if (phone.startsWith('0')) phone = '254' + phone.substring(1);
else if (!phone.startsWith('254')) phone = '254' + phone;

var btn = $('pay-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';

try {
var res = await fetch('/api/proxy/collect/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount),description:desc})
});
var d = await res.json();
if (d.error) return showError(d.error);
$('pay-status').innerHTML = '<span style="color:#3fb950">&#x2705; STK Push sent to ' + phone + '.</span><br><span style="color:#8b949e;font-size:12px">Ask customer to check phone and enter PIN.</span>';
showSuccess('Payment request sent!');
loadDeals();
} catch(e) { showError('Failed to send payment request.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4f1; Send STK Push'; }
}

// ── Withdraw ──
async function withdrawFunds() {
hideError();
var amount = $('withdraw-amount').value;
var phone = $('withdraw-phone').value.trim() || '254715641339';
if (!amount) return showError('Enter amount to withdraw');

phone = phone.replace(/[^0-9]/g,'');
if (phone.startsWith('0')) phone = '254' + phone.substring(1);
else if (!phone.startsWith('254')) phone = '254' + phone;

var btn = $('withdraw-btn');
btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Processing...';

try {
var res = await fetch('/api/proxy/withdraw/', {
method:'POST',
headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
body:JSON.stringify({phone:phone,amount:parseInt(amount)})
});
var d = await res.json();
if (d.error) return showError(d.error);
showSuccess('Withdrawal of KES ' + amount + ' queued to ' + phone);
loadStats();
} catch(e) { showError('Failed to process withdrawal.'); }
finally { btn.disabled = false; btn.innerHTML = '&#x1f4b8; Withdraw'; }
}

// ── Init ──
loadStats();
loadDeals();
// Auto-refresh stats every 30s
setInterval(loadStats, 30000);
// Auto-refresh deals every 15s
setInterval(loadDeals, 15000);
</script>
</body>
</html>
