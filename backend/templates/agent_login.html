{% extends "base.html" %}
{% block title %}Agent Login — TrustLayer{% endblock %}
{% block content %}
<div class="page" style="max-width:440px;display:flex;align-items:center;min-height:60vh;">
  <div class="card" style="width:100%;">
    <h1 style="font-size:24px;letter-spacing:-0.5px;margin-bottom:4px;">Agent Login</h1>
    <p style="color:var(--text2);margin-bottom:24px;font-size:14px;">Sign in to access the case queue.</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username</label>
        <input class="form-input" name="username" type="text" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" name="password" type="password" required>
      </div>
      <button class="btn btn-primary btn-full" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
