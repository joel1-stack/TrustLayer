{% extends "base.html" %}
{% block title %}Case submitted — TrustLayer{% endblock %}
{% block content %}
<div class="page" style="max-width:520px;text-align:center;">
  <div class="card">
    <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:50%;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;font-size:28px;">✓</div>
    <h1>Case submitted</h1>
    <div style="margin:16px 0;padding:12px;border:1px solid var(--border);border-radius:10px;font-weight:800;color:var(--orange);">{{ case_id }}</div>
    <p style="color:var(--text2);margin-bottom:20px;">Save this ID. Use it to track the case and verify the resolution.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <a class="btn btn-primary" href="/case/{{ case_id }}/">View case</a>
      <a class="btn btn-ghost" href="/">Home</a>
    </div>
  </div>
</div>
{% endblock %}
