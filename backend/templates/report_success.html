{% extends "base.html" %}
{% block title %}Case Submitted — TrustLayer{% endblock %}

{% block content %}
<div class="section">
  <div class="container-xs" style="text-align:center; padding:80px 0;">
    <div class="card card-lg">
      <div style="width:72px;height:72px;margin:0 auto 20px;border-radius:50%;background:rgba(16,185,129,.15);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:32px;">✓</div>
      <h1 style="font-size:32px;font-weight:900;margin-bottom:8px;">Case submitted</h1>
      <p style="color:var(--text2);margin-bottom:20px;">Save this case ID. Use it to track every step until you verify the resolution.</p>
      <div style="font-size:22px;font-weight:800;letter-spacing:.5px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:28px;">{{ case_id }}</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <a href="/case/{{ case_id }}/" class="btn btn-primary">View case</a>
        <a href="/track/" class="btn btn-secondary">Track another</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
