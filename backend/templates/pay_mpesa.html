<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLayer — Pay via M-Pesa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#00c46a;--green-dark:#009e56;--ink:#0d1117;--surface:#f4f6f0;--card:#ffffff;--muted:#6b7280;--border:#e2e8e0;--radius:14px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--card);border-radius:24px;box-shadow:0 4px 40px rgba(0,0,0,.08);width:100%;max-width:440px;overflow:hidden;}
.card-top{background:var(--ink);padding:32px 36px 28px;color:white;}
.badge{display:inline-block;background:#00A650;color:white;font-family:'DM Mono',monospace;font-size:11px;padding:4px 10px;border-radius:20px;margin-bottom:16px;letter-spacing:.05em;}
.card-top h1{font-size:22px;font-weight:600;margin-bottom:6px;}
.card-top p{font-size:14px;color:#9ca3af;}
.card-body{padding:32px 36px;}
.field{margin-bottom:20px;}
label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px;letter-spacing:.02em;}
input{width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:15px;font-family:'DM Sans',sans-serif;color:var(--ink);background:#fafafa;transition:border-color .2s,background .2s;}
input:focus{outline:none;border-color:var(--green);background:white;}
.deal-info{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;display:none;}
.deal-info.show{display:block;}
.deal-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;color:var(--muted);}
.deal-row:last-child{margin-bottom:0;font-weight:600;color:var(--ink);}
.deal-row span:last-child{font-family:'DM Mono',monospace;}
.btn{width:100%;padding:15px;background:#00A650;color:white;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s;font-family:'DM Sans',sans-serif;}
.btn:hover{background:#008f43;}
.btn:active{transform:scale(.98);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--muted);border:1.5px solid var(--border);margin-top:10px;}
.btn-secondary:hover{background:var(--surface);color:var(--ink);}
.nav{display:flex;gap:8px;justify-content:center;padding:16px 0 8px;border-top:1px solid var(--border);margin-top:8px;}
.nav a{font-size:13px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;transition:background .15s;}
.nav a:hover{background:var(--surface);color:var(--ink);}
.nav a.active{color:var(--green);font-weight:600;}
.msg{padding:14px 16px;border-radius:var(--radius);font-size:14px;margin-top:16px;display:none;}
.msg.ok{display:block;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;}
.msg.err{display:block;background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.msg.loading{display:block;background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #fde68a;border-top-color:#92400e;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="card-top">
    <div class="badge">M-PESA STK PUSH</div>
    <h1>Pay via M-Pesa</h1>
    <p>Enter deal code and phone to trigger payment prompt</p>
  </div>
  <div class="card-body">
    <div class="field">
      <label>Deal Code</label>
      <input type="text" id="dealCode" placeholder="TL-XXXXXX" oninput="this.value=this.value.toUpperCase()" onblur="lookupDeal()">
    </div>
    <div class="deal-info" id="dealInfo">
      <div class="deal-row"><span>Amount</span><span id="dAmt">—</span></div>
      <div class="deal-row"><span>Fee (1.5%)</span><span id="dFee">—</span></div>
      <div class="deal-row"><span>You will pay</span><span id="dTotal">—</span></div>
    </div>
    <div class="field">
      <label>M-Pesa Phone Number</label>
      <input type="tel" id="phone" placeholder="0712345678 or 254712345678">
    </div>
    <button class="btn" id="btn" onclick="pay()">Send STK Push</button>
    <div class="msg" id="msg"></div>
  </div>
  <nav class="nav">
    <a href="/create-deal/">Create</a>
    <a href="/pay-mpesa/" class="active">Pay</a>
    <a href="/deal-status/">Status</a>
  </nav>
</div>
<script>
const AUTH = 'Basic ' + btoa('root:Joel@2026');
window.onload=()=>{
  const saved=localStorage.getItem('deal_code');
  if(saved)document.getElementById('dealCode').value=saved;
  if(saved)lookupDeal();
};
async function lookupDeal(){
  const code=document.getElementById('dealCode').value.trim().toUpperCase();
  if(!code.startsWith('TL-'))return;
  try{
    const r=await fetch('/api/nano/deals/'+code+'/',{headers:{'Authorization':AUTH}});
    if(r.ok){
      const d=await r.json();
      document.getElementById('dAmt').textContent='KES '+parseFloat(d.amount).toLocaleString();
      document.getElementById('dFee').textContent='KES '+d.fee;
      document.getElementById('dTotal').textContent='KES '+d.total_payable;
      document.getElementById('dealInfo').classList.add('show');
    }
  }catch(e){}
}
async function pay(){
  const code=document.getElementById('dealCode').value.trim().toUpperCase();
  const phone=document.getElementById('phone').value.trim();
  if(!code||!phone){showMsg('Both deal code and phone are required.','err');return;}
  const btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Sending...';
  showMsg('<span class="spinner"></span>Sending STK Push to your phone...','loading');
  try{
    const r=await fetch('/api/nano/pay/',{method:'POST',headers:{'Content-Type':'application/json','Authorization':AUTH},body:JSON.stringify({deal_code:code,phone:phone})});
    const d=await r.json();
    if(r.ok&&d.success){
      localStorage.setItem('deal_code',code);
      showMsg('<strong>STK Push sent!</strong><br>Check your phone and enter your M-Pesa PIN.<br><br>Amount: KES '+d.amount_charged+'<br><br><a href="/deal-status/" style="color:#166534;font-weight:600;">→ Check deal status</a>','ok');
    } else {
      showMsg('Failed: '+(d.message||d.error||JSON.stringify(d)),'err');
      btn.disabled=false;btn.textContent='Send STK Push';
    }
  }catch(e){showMsg('Network error: '+e.message,'err');btn.disabled=false;btn.textContent='Send STK Push';}
}
function showMsg(m,t){const el=document.getElementById('msg');el.innerHTML=m;el.className='msg '+t;}
</script>
</body>
</html>
