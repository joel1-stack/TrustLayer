<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustLayer - M-PESA Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 450px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .confirm-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            display: none;
        }

        .confirm-section.active {
            display: block;
        }

        .confirm-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .confirm-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
        }

        .confirm-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .confirm-label {
            color: #666;
            font-size: 14px;
        }

        .confirm-value {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-confirm {
            background: #00A650;
            color: white;
            margin-bottom: 10px;
        }

        .btn-confirm:hover {
            background: #008f43;
            transform: translateY(-2px);
        }

        .btn-edit {
            background: #f0f0f0;
            color: #333;
        }

        .btn-edit:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.loading {
            display: block;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00A650;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mpesa-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .mpesa-logo span {
            display: inline-block;
            background: #00A650;
            color: white;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mpesa-logo">
            <span>M-PESA</span>
        </div>
        
        <div class="header">
            <h1>TrustLayer Payment</h1>
            <p>Enter your details to receive STK Push</p>
        </div>

        <form id="paymentForm">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input 
                    type="tel" 
                    id="phone" 
                    placeholder="254712345678" 
                    required
                    pattern="254[0-9]{9}"
                    title="Format: 2547XXXXXXXX"
                >
            </div>

            <div class="form-group">
                <label for="amount">Amount (KES)</label>
                <input 
                    type="number" 
                    id="amount" 
                    placeholder="100" 
                    min="1" 
                    max="150000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <input 
                    type="text" 
                    id="description" 
                    placeholder="Payment for services" 
                    value="TrustLayer Payment"
                >
            </div>

            <button type="submit" class="btn btn-confirm" id="submitBtn">
                Review & Confirm
            </button>
        </form>

        <div class="confirm-section" id="confirmSection">
            <h3>Confirm Payment Details</h3>
            
            <div class="confirm-row">
                <span class="confirm-label">Phone Number:</span>
                <span class="confirm-value" id="confirmPhone"></span>
            </div>
            
            <div class="confirm-row">
                <span class="confirm-label">Amount:</span>
                <span class="confirm-value" id="confirmAmount"></span>
            </div>
            
            <div class="confirm-row">
                <span class="confirm-label">Description:</span>
                <span class="confirm-value" id="confirmDesc"></span>
            </div>

            <button class="btn btn-confirm" id="sendBtn">
                Send STK Push to My Phone
            </button>
            
            <button class="btn btn-edit" id="editBtn">
                Edit Details
            </button>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('paymentForm');
        const confirmSection = document.getElementById('confirmSection');
        const submitBtn = document.getElementById('submitBtn');
        const sendBtn = document.getElementById('sendBtn');
        const editBtn = document.getElementById('editBtn');
        const result = document.getElementById('result');

        let formData = {};

        // Format phone number
        function formatPhone(phone) {
            phone = phone.replace(/\D/g, '');
            if (phone.startsWith('07') || phone.startsWith('01')) {
                phone = '254' + phone.substring(1);
            } else if (phone.startsWith('7') || phone.startsWith('1')) {
                phone = '254' + phone;
            } else if (phone.startsWith('0')) {
                phone = '254' + phone.substring(1);
            }
            return phone;
        }

        // Show confirmation
        form.onsubmit = (e) => {
            e.preventDefault();
            
            const phone = formatPhone(document.getElementById('phone').value);
            const amount = document.getElementById('amount').value;
            const description = document.getElementById('description').value;

            // Validate
            if (!phone.match(/^254[0-9]{9}$/)) {
                showResult('Please enter a valid phone number (2547XXXXXXXX)', 'error');
                return;
            }

            if (amount < 1) {
                showResult('Amount must be at least 1 KES', 'error');
                return;
            }

            formData = { phone, amount, description };

            // Show confirmation
            document.getElementById('confirmPhone').textContent = phone;
            document.getElementById('confirmAmount').textContent = 'KES ' + parseFloat(amount).toLocaleString();
            document.getElementById('confirmDesc').textContent = description;

            form.style.display = 'none';
            confirmSection.classList.add('active');
        };

        // Edit button
        editBtn.onclick = () => {
            confirmSection.classList.remove('active');
            form.style.display = 'block';
            result.className = 'result';
        };

        // Send STK Push
        sendBtn.onclick = async () => {
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending...';
            
            showResult('<span class="spinner"></span>Initiating M-PESA STK Push...', 'loading');

            try {
        const response = await fetch('/api/payments/stk_push/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken'),
            'X-API-KEY': 'devkey'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        phone_number: formData.phone,
                        amount: formData.amount,
                        description: formData.description
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showResult(
                        `<strong>✓ STK Push Sent!</strong><br>
                        Transaction ID: ${data.transaction_id}<br>
                        Checkout Request: ${data.checkout_request_id}<br><br>
                        <strong>Check your phone now and enter M-PESA PIN to complete payment.</strong>`,
                        'success'
                    );
                } else {
                    showResult(
                        `<strong>✗ Failed:</strong> ${data.error || data.details || 'Unknown error'}`,
                        'error'
                    );
                    sendBtn.disabled = false;
                    sendBtn.textContent = 'Try Again';
                }
            } catch (error) {
                showResult(
                    `<strong>✗ Error:</strong> ${error.message}<br><br>
                    Make sure:<br>
                    1. You are logged in at <a href="/admin/" target="_blank">/admin/</a><br>
                    2. Docker is running`,
                    'error'
                );
                sendBtn.disabled = false;
                sendBtn.textContent = 'Try Again';
            }
        };

        function showResult(message, type) {
            result.innerHTML = message;
            result.className = 'result ' + type;
        }

        // simple csrftoken helper
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
    </script>
</body>
</html>
