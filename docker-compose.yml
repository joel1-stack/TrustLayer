services:
  # PostgreSQL Database
  postgres_db:
    image: postgres:16-alpine
    container_name: trustlayer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-trustlayer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TrustLayer2026!}
      POSTGRES_DB: ${DB_NAME:-trustlayer}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-trustlayer} -d ${DB_NAME:-trustlayer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis_cache:
    image: redis:7-alpine
    container_name: trustlayer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Django API Server
  django_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustlayer_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started

  # Celery Worker (processes background tasks)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustlayer_worker
    restart: unless-stopped
    command: celery -A trustlayer worker --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started

  # Celery Beat (scheduled tasks — auto-release, etc.)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustlayer_beat
    restart: unless-stopped
    command: celery -A trustlayer beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started

volumes:
  pgdata:
  redisdata:
