services:
  - type: web
    name: trustlayer
    runtime: python
    rootDir: backend
    pythonVersion: "3.12.3"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn trustlayer.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trustlayer-db
          property: connectionString
      - key: MPESA_ENVIRONMENT
        value: sandbox
      - key: SMS_PROVIDER
        value: generic

databases:
  - name: trustlayer-db
    databaseName: trustlayer_db
    user: trustlayer_user
    plan: free
